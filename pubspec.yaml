name: unibazaar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"



dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_database: ^12.1.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  image_picker: ^1.1.2
  firebase_storage: ^13.0.4
  cloudinary: ^1.2.0
  http: ^1.2.2
  http_parser: ^4.0.2
  url_launcher: ^6.2.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
